<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#060a10">
<!-- Adicionado para corrigir o topo no iPhone -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>YGO Master Simulator - Pro Field</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  --master-blue:#0d1b2a; --master-dark:#060a10; --master-panel:rgba(13, 27, 42, 0.95);
  --master-border:#1d3557; --master-cyan:#00f2fe; --master-gold:#ffd700;
  --master-cyan-glow:rgba(0, 242, 254, 0.35); --text:#e0fbfc; --muted:#8d99ae;
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

/* Fundo escuro forçado para remover a faixa branca no topo do iOS */
html {
  background-color: var(--master-dark);
}

body{
  margin:0; background:radial-gradient(circle at 50% 20%, #1b263b 0%, #060a10 80%);
  color:var(--text); font-family:'Rajdhani',sans-serif; min-height:100vh;
  padding:env(safe-area-inset-top) 8px calc(14px + env(safe-area-inset-bottom)); overflow-x:hidden;
}
